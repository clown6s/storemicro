# ============================================================
# StoreMicro 全栈编排 — 生产级配置
# ============================================================
# 使用: docker compose up -d
#
# 启动顺序: MySQL → Redis/etcd → user/district → gateway
#
# ⚠️⚠️⚠️ 生产环境部署前必须修改:
# 1. x-password: 替换为强密码（至少32位，含大小写+数字+特殊字符）
# 2. x-jwt-secret: 替换为独立的随机密钥（至少64位）
# 3. x-metrics-password: 设置 metrics 监控密码
#
# 安全提示:
# - 所有服务已启用 cap_drop ALL + no-new-privileges
# - 微服务(user/district/gateway)运行在 read_only 文件系统
# - 敏感信息建议通过 Docker Secrets 或外部 .env 文件管理
#   参考 .env.example 模板: cp .env.example .env
# - Jaeger 内存存储仅供开发/测试，生产需替换为持久化后端
# ============================================================

name: storemicro

# ---- 全局锚点 ----
x-timezone: &timezone "Asia/Shanghai"
x-password: &password "admin@zzp"
x-jwt-secret: &jwt-secret "storemicro_jwt_secret_2026_for_dev_and_test_only_change_in_production_64chars"
x-metrics-password: &metrics-password "admin@zzp"

# 容器日志限制：单文件50MB，最多保留5个（总计250MB/容器）
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"
    compress: "true"

# 停止信号与优雅关闭超时
x-stop-grace: &stop-grace 30s

services:

  # =========================
  # 基础设施
  # =========================

  mysql:
    image: mysql:8.4
    container_name: storemicro-mysql
    environment:
      TZ: *timezone
      MYSQL_ROOT_PASSWORD: *password
      MYSQL_DATABASE: store_micro
      MYSQL_USER: storemicro_app
      MYSQL_PASSWORD: *password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-flush-method=O_DIRECT
      - --sync-binlog=1
      - --slow-query-log=1
      - --long-query-time=2
      - --log-queries-not-using-indexes=1
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --local-infile=0
#    ports:
#      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/run/mysqld:rw,noexec,nosuid
    restart: always
    stop_grace_period: 60s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
      - NET_RAW
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
          pids: 256
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal
      - app

  redis:
    image: redis:8.6.2
    container_name: storemicro-redis
    environment:
      TZ: *timezone
      REDISCLI_AUTH: *password
    command:
      - redis-server
      - --requirepass
      - *password
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --maxmemory
      - "192mb"
      - --maxmemory-policy
      - "allkeys-lru"
      - --hz
      - "100"
      - --tcp-keepalive
      - "300"
      - --timeout
      - "0"
#    ports:
#      - "6379:6379"
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: always
    stop_grace_period: *stop-grace
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - SETPCAP
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging
    networks:
      - internal
      - app

  etcd:
    image: quay.io/coreos/etcd:v3.6.9
    container_name: storemicro-etcd
    environment:
      TZ: *timezone
      ALLOW_NONE_AUTHENTICATION: "yes"
    # 不暴露端口到宿主机，仅容器间通信（生产环境必须）
    # ports:
    #   - "2379:2379"
    command:
      - /usr/local/bin/etcd
      - --name
      - "etcd"
      - --data-dir
      - "/data"
      - --listen-client-urls
      - "http://0.0.0.0:2379"
      - --advertise-client-urls
      - "http://etcd:2379"
      - --listen-peer-urls
      - "http://0.0.0.0:2380"
      - --initial-advertise-peer-urls
      - "http://etcd:2380"
      - --initial-cluster
      - "etcd=http://etcd:2380"
      - --auto-compaction-retention=1h
      - --auto-compaction-mode
      - "periodic"
      - --snapshot-count
      - "10000"
      - --quota-backend-bytes
      - "2147483648"
      - --max-request-bytes
      - "1048576"
    volumes:
      - etcd_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: always
    stop_grace_period: *stop-grace
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    networks:
      - internal

  # =========================
  # 微服务
  # =========================

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: storemicro-user
    labels:
      loki.enabled: "true"
      loki.job: "user"
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # ports: gRPC 6001、metrics 9101 生产环境不暴露（仅容器间通信）
    environment:
      TZ: *timezone
      DB_PASSWORD: *password
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_PASSWORD: *password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ETCD_ENDPOINT: etcd:2379
      JWT_SECRET: *jwt-secret
      JWT_REFRESH_SECRET: "storemicro_jwt_refresh_secret_2026_independent_from_access_64chars!!"
      METRICS_PASSWORD: *metrics-password
      LOG_LEVEL: info
      LOG_MODE: prod
      GOGC: "100"
      GOMEMLIMIT: "400MiB"
      TRACING_ENDPOINT: jaeger:4317
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
          pids: 64
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9101/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - app
      - internal

  district:
    build:
      context: .
      dockerfile: district/Dockerfile
    container_name: storemicro-district
    labels:
      loki.enabled: "true"
      loki.job: "district"
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # ports: gRPC 6002、metrics 9103 生产环境不暴露（仅容器间通信）
    environment:
      TZ: *timezone
      DB_PASSWORD: *password
      DB_HOST: mysql
      DB_PORT: "3306"
      ETCD_ENDPOINT: etcd:2379
      METRICS_PASSWORD: *metrics-password
      LOG_LEVEL: info
      LOG_MODE: prod
      GOGC: "100"
      GOMEMLIMIT: "200MiB"
      TRACING_ENDPOINT: jaeger:4317
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9103/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - app
      - internal

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: storemicro-gateway
    labels:
      loki.enabled: "true"
      loki.job: "gateway"
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    ports:
      - "7000:7000"
    environment:
      TZ: *timezone
      JWT_SECRET: *jwt-secret
      REDIS_PASSWORD: *password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ETCD_ENDPOINT: etcd:2379
      METRICS_PASSWORD: *metrics-password
      LOG_LEVEL: info
      LOG_MODE: prod
      GOGC: "100"
      GOMEMLIMIT: "400MiB"
      TRACING_ENDPOINT: jaeger:4317
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      user:
        condition: service_healthy
      district:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
          pids: 64
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - app
      - internal

  # =========================
  # 可观测性：指标监控
  # =========================

  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: storemicro-prometheus
    user: "65534:65534"
    read_only: true
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      TZ: *timezone
    restart: always
    stop_grace_period: *stop-grace
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 128
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    networks:
      - app

  # =========================
  # 可观测性：链路追踪
  # =========================

  jaeger:
    image: jaegertracing/jaeger:2.3.0
    container_name: storemicro-jaeger
    user: "0:0"
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI（仅本机访问，生产应通过反向代理）
      - "127.0.0.1:4317:4317"     # OTLP gRPC（仅本机访问）
      - "127.0.0.1:4318:4318"     # OTLP HTTP（仅本机访问）
    volumes:
      - ./jaeger/jaeger-config.yaml:/etc/jaeger/config.yaml:ro
      - ./jaeger/data:/var/lib/jaeger
    command: --config=/etc/jaeger/config.yaml
    environment:
      TZ: *timezone
    restart: always
    stop_grace_period: *stop-grace
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 128
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    networks:
      - app

  # =========================
  # 可观测性：日志收集
  # =========================

  loki:
    image: grafana/loki:3.5.1
    container_name: storemicro-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    volumes:
      - loki_data:/loki
    environment:
      TZ: *timezone
    restart: always
    stop_grace_period: *stop-grace
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    networks:
      - internal

  promtail:
    image: grafana/promtail:3.5.1
    container_name: storemicro-promtail
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    environment:
      TZ: *timezone
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          memory: 32M
    logging: *logging
    networks:
      - app
      - internal

  grafana:
    image: grafana/grafana:11.6.0
    container_name: storemicro-grafana
    ports:
      - "3000:3000"
    environment:
      TZ: *timezone
      GF_SECURITY_ADMIN_USER: admin
      # ⚠️ 生产环境必须修改 Grafana 密码（GF_SECURITY_ADMIN_PASSWORD）
      GF_SECURITY_ADMIN_PASSWORD: *password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    stop_grace_period: *stop-grace
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
      - CHOWN
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    networks:
      - app
      - internal

# ============================================================
# 网络
# ============================================================
networks:
  # app 网络：应用服务可访问外部（exposed ports）和内部服务
  app:
    driver: bridge
  # internal 网络：仅 MySQL/Redis/etcd 基础设施，应用服务通过此网络访问
  internal:
    driver: bridge
    internal: true

# ============================================================
# 持久化卷
# ============================================================
volumes:
  mysql_data:
    name: storemicro-mysql-data
  redis_data:
    name: storemicro-redis-data
  etcd_data:
    name: storemicro-etcd-data
  loki_data:
    name: storemicro-loki-data
  grafana_data:
    name: storemicro-grafana-data
  prometheus_data:
    name: storemicro-prometheus-data
