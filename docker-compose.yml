services:
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    ports:
      - "9101:9101"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=info
    depends_on:
      - mysql
      - redis
      - etcd
    restart: unless-stopped

  district:
    build:
      context: ./district
      dockerfile: Dockerfile
    ports:
      - "9103:9103"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - LOG_LEVEL=info
    depends_on:
      - mysql
      - etcd
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - METRICS_PASSWORD=${METRICS_PASSWORD:-}
      - LOG_LEVEL=info
    depends_on:
      - user
      - district
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: store_micro
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  etcd:
    image: bitnami/etcd:3
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/bitnami/etcd
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  etcd_data:
