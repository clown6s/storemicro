# ============================================================
# StoreMicro 全栈编排 — 生产级配置
# ============================================================
# 使用: docker compose up -d
#
# 启动顺序: MySQL → Redis/etcd → user/district → gateway
#
# ⚠️ 生产环境部署前必须修改:
# 1. x-password: 替换为强密码（至少32位，含大小写+数字+特殊字符）
# 2. x-jwt-secret: 替换为独立的随机密钥（至少64位）
# 3. x-metrics-password: 设置 metrics 监控密码
# ============================================================

name: storemicro

# ---- 全局锚点 ----
x-timezone: &timezone "Asia/Shanghai"
x-password: &password "CHANGE_ME_STRONG_PASSWORD_32CHARS_MIN"
x-jwt-secret: &jwt-secret "CHANGE_ME_RANDOM_JWT_SECRET_AT_LEAST_64_CHARS_LONG"
x-metrics-password: &metrics-password "CHANGE_ME_METRICS_PASSWORD"

# 容器日志限制：单文件50MB，最多保留5个（总计250MB/容器）
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"
    compress: "true"

# 停止信号与优雅关闭超时
x-stop-grace: &stop-grace 30s

services:

  # =========================
  # 基础设施
  # =========================

  mysql:
    image: mysql:8.4
    container_name: storemicro-mysql
    environment:
      TZ: *timezone
      MYSQL_ROOT_PASSWORD: *password
      MYSQL_DATABASE: store_micro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
      --default-authentication-plugin=caching_sha2_password
      --skip-name-resolve
      --skip-host-cache
      --max-connections=200
      --innodb-buffer-pool-size=256M
      --innodb-flush-log-at-trx-commit=1
      --innodb-flush-method=O_DIRECT
      --sync-binlog=1
      --slow-query-log=1
      --long-query-time=2
      --log-queries-not-using-indexes=1
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      --local-infile=0
    # 不暴露端口到宿主机，仅容器间通信（生产环境必须）
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging
    networks:
      - internal

  redis:
    image: redis:8.6.2
    container_name: storemicro-redis
    environment:
      TZ: *timezone
      REDIS_PASSWORD: *password
      REDISCLI_AUTH: *password
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
      --rename-command CONFIG ""
      --hz 100
      --tcp-keepalive 300
      --timeout 0
    # 不暴露端口到宿主机，仅容器间通信（生产环境必须）
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks:
      - internal

  etcd:
    image: quay.io/coreos/etcd:v3.6.9
    container_name: storemicro-etcd
    environment:
      TZ: *timezone
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    # 不暴露端口到宿主机，仅容器间通信（生产环境必须）
    # ports:
    #   - "2379:2379"
    command: >
      /usr/local/bin/etcd
      --name etcd
      --data-dir /data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --auto-compaction-retention=1h
      --auto-compaction-mode=periodic
      --snapshot-count=10000
      --quota-backend-bytes=2147483648
      --max-request-bytes=1048576
    volumes:
      - etcd_data:/data
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks:
      - internal

  # =========================
  # 微服务
  # =========================

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: storemicro-user
    ports:
      - "6001:6001"
      - "9101:9101"
    environment:
      TZ: *timezone
      DB_PASSWORD: *password
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_PASSWORD: *password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ETCD_ENDPOINT: etcd:2379
      JWT_SECRET: *jwt-secret
      METRICS_PASSWORD: *metrics-password
      LOG_LEVEL: info
      LOG_MODE: prod
      GOGC: "100"
      GOMEMLIMIT: "400MiB"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9101/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    pids_limit: 64
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - app
      - internal

  district:
    build:
      context: .
      dockerfile: district/Dockerfile
    container_name: storemicro-district
    ports:
      - "6002:6002"
      - "9103:9103"
    environment:
      TZ: *timezone
      DB_PASSWORD: *password
      DB_HOST: mysql
      DB_PORT: "3306"
      ETCD_ENDPOINT: etcd:2379
      METRICS_PASSWORD: *metrics-password
      LOG_LEVEL: info
      LOG_MODE: prod
      GOGC: "100"
      GOMEMLIMIT: "200MiB"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9103/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    pids_limit: 64
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - app
      - internal

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: storemicro-gateway
    ports:
      - "7000:7000"
    environment:
      TZ: *timezone
      JWT_SECRET: *jwt-secret
      REDIS_PASSWORD: *password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ETCD_ENDPOINT: etcd:2379
      METRICS_PASSWORD: *metrics-password
      LOG_LEVEL: info
      LOG_MODE: prod
      GOGC: "100"
      GOMEMLIMIT: "400MiB"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      user:
        condition: service_healthy
      district:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    stop_grace_period: *stop-grace
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    pids_limit: 64
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - app
      - internal

# ============================================================
# 网络
# ============================================================
networks:
  # app 网络：应用服务可访问外部（exposed ports）和内部服务
  app:
    driver: bridge
  # internal 网络：仅 MySQL/Redis/etcd 基础设施，应用服务通过此网络访问
  internal:
    driver: bridge
    internal: true

# ============================================================
# 持久化卷
# ============================================================
volumes:
  mysql_data:
    name: storemicro-mysql-data
  redis_data:
    name: storemicro-redis-data
  etcd_data:
    name: storemicro-etcd-data
