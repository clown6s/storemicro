syntax = "proto3";

package conf;

option go_package = "user/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server          server          = 1;
  Data            data            = 2;
  Logger          logger          = 3;
  Registry        registry        = 4;
  Tracing         tracing         = 5;
  Jwt             jwt             = 6;
  Redis           redis           = 7;
  string          metrics_password = 8;  // Prometheus metrics 认证密码，为空则禁用
}

message Tracing {
  string endpoint   = 1;  // OTLP gRPC 端点，如 10.211.55.5:4317
  double sampleRate = 2;  // 采样率 0.0-1.0，默认 0.1
}

message Server {
  message GRPC {
    string                addr      = 1;
    google.protobuf.Duration timeout   = 2;
    string                certFile  = 3;  // TLS 证书文件路径，为空则不启用 TLS
    string                keyFile   = 4;  // TLS 私钥文件路径
  }
  GRPC grpc = 1;
}

message Data {
  message Database {
    string  driver          = 1;
    string  source          = 2;
    int64   maxOpenConns    = 3;
    int64   maxIdleConns    = 4;
    int64   connMaxLifetime = 5;
    int64   connMaxIdleTime = 6;
  }
  Database database = 1;
}

message Logger {
  string level = 1;
}

message Registry {
  message Etcd {
    repeated string endpoints = 1;
    int64     timeout    = 2;
    string    username   = 3;  // etcd 认证用户名（可选）
    string    password   = 4;  // etcd 认证密码（可选）
  }
  Etcd etcd = 1;
}

// JWT 配置
message Jwt {
  string secret     = 1;  // 签名密钥
  int64  expireHours = 2;  // token 有效期（小时）
}

// Redis 配置
message Redis {
  string addr     = 1;  // redis 地址，如 10.211.55.5:6379
  string password = 2;  // redis 密码
  int32  db       = 3;  // redis DB 号
  int32  poolSize    = 4;  // 连接池大小，默认 20
  int32  minIdleConns = 5;  // 最小空闲连接数，默认 5
  google.protobuf.Duration dialTimeout   = 6;  // 连接超时，默认 3s
  google.protobuf.Duration readTimeout   = 7;  // 读超时，默认 5s
  google.protobuf.Duration writeTimeout  = 8;  // 写超时，默认 5s
  int32  maxRetries  = 9;  // 最大重试次数，默认 3
  int32  connMaxIdleTime = 10; // 空闲连接最大存活时间（秒），默认 300
}
