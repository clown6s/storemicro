server:
  grpc:
    addr: 0.0.0.0:9001
    timeout: 10s

data:
  database:
    driver: mysql
    source: root:${DB_PASSWORD:admin@zzp}@tcp(${DB_HOST:10.211.55.5}:${DB_PORT:3306})/store_micro?charset=utf8mb4&parseTime=true&loc=Local
    max_open_conns: 100
    max_idle_conns: 25
    conn_max_lifetime: 3600

logger:
  level: info
  # mode 和文件轮转通过环境变量配置：
  #   LOG_MODE=prod       启用 JSON 格式（默认 dev = console 彩色）
  #   LOG_FILE=/var/log/storemicro/user.log  启用文件输出+轮转
  #   LOG_COMPRESS=true   启用 gzip 压缩旧日志

registry:
  etcd:
    endpoints:
      - 10.211.55.5:2379
    timeout: 10

# JWT 配置（⚠️ 生产环境必须通过环境变量 JWT_SECRET 注入，不得使用默认值）
jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars!!}
  expire_hours: 24

# Redis 配置（⚠️ 生产环境必须通过环境变量 REDIS_PASSWORD 注入，不得使用默认值）
redis:
  addr: ${REDIS_HOST:10.211.55.5}:${REDIS_PORT:6379}
  password: "${REDIS_PASSWORD:admin@zzp}"
  db: 0

# 链路追踪
tracing:
  endpoint: "10.211.55.5:4317"
  sample_rate: 0.1
