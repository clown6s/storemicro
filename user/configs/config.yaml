server:
  grpc:
    addr: 0.0.0.0:9001
    timeout: 10s

data:
  database:
    driver: mysql
    source: "root:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT:3306})/store_micro?charset=utf8mb4&parseTime=true&loc=Local"
    max_open_conns: 100
    max_idle_conns: 25
    conn_max_lifetime: 3600

logger:
  level: info
  # mode 和文件轮转通过环境变量配置：
  #   LOG_MODE=prod       启用 JSON 格式（默认 dev = console 彩色）
  #   LOG_FILE=/var/log/storemicro/user.log  启用文件输出+轮转
  #   LOG_COMPRESS=true   启用 gzip 压缩旧日志

registry:
  etcd:
    endpoints:
      - "${ETCD_ENDPOINT}"
    timeout: 10

# JWT 配置（⚠️ 生产环境必须通过环境变量 JWT_SECRET 注入）
jwt:
  secret: "${JWT_SECRET}"
  expire_hours: 24

# Redis 配置（⚠️ 生产环境必须通过环境变量注入密码）
redis:
  addr: "${REDIS_HOST}:${REDIS_PORT}"
  password: "${REDIS_PASSWORD}"
  db: 0

# 链路追踪
tracing:
  endpoint: "${TRACING_ENDPOINT}"
  sample_rate: 0.1
