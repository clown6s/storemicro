server:
  grpc:
    addr: :6001
    timeout: 10s

data:
  database:
    driver: mysql
    source: "root:${DB_PASSWORD:admin@zzp}@tcp(${DB_HOST:10.211.55.5}:${DB_PORT:3306})/store_micro?charset=utf8mb4&parseTime=true&loc=Local"
    maxOpenConns: 100
    maxIdleConns: 25
    connMaxLifetime: 3600

logger:
  level: info


registry:
  etcd:
    endpoints:
      - "${ETCD_ENDPOINT:10.211.55.5:2379}"
    timeout: 10

# JWT 配置（⚠️ 生产环境必须通过环境变量 JWT_SECRET 注入）
jwt:
  secret: '${JWT_SECRET:4*8#5@7!^i(nj_9876555=+s4x3v9g12m`js0lmb8(-=+-_!`~||\]}mb<.?,.>>,mncukdkieijufonicndknveufw3io}'
  expireHours: 24

# Redis 配置（⚠️ 生产环境必须通过环境变量注入密码）
redis:
  addr: "${REDIS_HOST:10.211.55.5}:${REDIS_PORT:6379}"
  password: "${REDIS_PASSWORD:admin@zzp}"
  db: 0
  # poolSize: 20        # 连接池大小（默认 20）
  # minIdleConns: 5     # 最小空闲连接（默认 5）
  # dialTimeout: 3s     # 连接超时（默认 3s）
  # readTimeout: 5s     # 读超时（默认 5s）
  # writeTimeout: 5s    # 写超时（默认 5s）
  # maxRetries: 3       # 最大重试次数（默认 3）
  # connMaxIdleTime: 300 # 空闲连接最大存活时间（秒，默认 300）

# 链路追踪
tracing:
  endpoint: "${TRACING_ENDPOINT:10.211.55.5:4317}"
  sampleRate: 1.0

# Prometheus metrics 认证密码
metricsPassword: "${METRICS_PASSWORD:dev123}"
