server:
  grpc:
    addr: 0.0.0.0:9001
    timeout: 10s
    qps: 100

data:
  database:
    driver: mysql
    source: ${DB_SOURCE:root:admin@zzp@tcp(10.211.55.5:3306)/store_micro?charset=utf8mb4&parseTime=true&loc=Local}
    max_open_conns: 100
    max_idle_conns: 25
    conn_max_lifetime: 3600

logger:
  level: info

registry:
  etcd:
    endpoints:
      - 10.211.55.5:2379
    timeout: 10

# JWT 配置（生产环境通过 JWT_SECRET 环境变量注入）
jwt:
  secret: "${JWT_SECRET:store-micro-jwt-secret-2026}"
  expire_hours: 24

# Redis 配置
redis:
  addr: ${REDIS_ADDR:10.211.55.5:6379}
  password: "${REDIS_PASSWORD:admin@zzp}"
  db: 0

# 链路追踪
tracing:
  endpoint: "10.211.55.5:4317"
  sample_rate: 0.1
