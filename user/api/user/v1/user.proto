syntax = "proto3";

// v1 — 用户服务 API（稳定版）
// WARNING: 此文件与 gateway/api/user/v1/user.proto 保持同步，修改时需同步更新两处
package api.user.v1;

option go_package = "user/api/user/v1;userv1";

import "google/api/annotations.proto";

service User {
  rpc GetUser (GetUserReq) returns (GetUserResp) {
    option (google.api.http) = {
      get: "/api/v1/user/{id}"
    };
  }
  // 用户注册
  rpc Register (RegisterReq) returns (RegisterResp) {
    option (google.api.http) = {
      post: "/api/v1/user/register"
      body: "*"
    };
  }
  // 用户登录（手机号+密码）
  rpc Login (LoginReq) returns (LoginResp) {
    option (google.api.http) = {
      post: "/api/v1/user/login"
      body: "*"
    };
  }
  // 用户列表（分页）
  rpc ListUsers (ListUsersReq) returns (ListUsersResp) {
    option (google.api.http) = {
      get: "/api/v1/user/list"
    };
  }
  // 用户登出（token 从 Authorization header 获取，不再通过 body 传递）
  rpc Logout (LogoutReq) returns (LogoutResp) {
    option (google.api.http) = {
      post: "/api/v1/user/logout"
    };
  }
  // 更新用户资料
  rpc UpdateUser (UpdateUserReq) returns (UpdateUserResp) {
    option (google.api.http) = {
      put: "/api/v1/user/{id}"
      body: "*"
    };
  }
  // 删除用户（软删除）
  rpc DeleteUser (DeleteUserReq) returns (DeleteUserResp) {
    option (google.api.http) = {
      delete: "/api/v1/user/{id}"
    };
  }
}

message GetUserReq {
  int64 id = 1;
}

message GetUserResp {
  uint32 code = 1;
  string message = 2;
  UserInfo data = 3;
  reserved 4 to 99;
}

// 用户实体（不含密码）
message UserInfo {
  int64  id          = 1;
  string email       = 2;
  string phone       = 3;
  string real_name   = 4;  // snake_case per protobuf style guide
  string avatar      = 5;
  int32  gender      = 6;
  int32  age         = 7;
  string create_time = 8;  // TODO: 迁移为 google.protobuf.Timestamp
  string update_time = 9;  // TODO: 迁移为 google.protobuf.Timestamp
  string remark      = 10;
  reserved 11 to 99;
}

// 注册
message RegisterReq {
  string phone      = 1;
  string password   = 2;
  string email      = 3;
  string real_name  = 4;
  string avatar     = 5;
  int32  gender     = 6;
  int32  age        = 7;
  string remark     = 8;
  reserved 9 to 99;
}

message RegisterResp {
  uint32 code = 1;
  string message = 2;
  reserved 3 to 99;
}

// 登录
message LoginReq {
  string phone    = 1;
  string password = 2;
  reserved 3 to 99;
}

message LoginResp {
  uint32 code    = 1;
  string message = 2;
  string token   = 3;
  UserInfo data  = 4;
  reserved 5 to 99;
}

// 用户列表（分页）
message ListUsersReq {
  int32  page        = 1;
  int32  page_size   = 2;
  string phone       = 3;
  string name        = 4;
  // 排序字段（白名单校验：id, create_time, update_time），默认 "id"
  string sort_by     = 5;
  // 排序方向："asc" 或 "desc"，默认 "desc"
  string sort_order  = 6;
  reserved 7 to 99;
}

message ListUsersResp {
  uint32         code      = 1;
  string         message   = 2;
  int64          total     = 3;
  int32          page      = 4;
  int32          page_size = 5;
  repeated UserInfo data   = 6;
  reserved 7 to 99;
}

// 登出（token 从 Authorization header 获取，消息体无需传 token）
message LogoutReq {
  reserved 1 to 99;  // token 字段已移除，改从 header 获取
}

message LogoutResp {
  uint32 code    = 1;
  string message = 2;
  reserved 3 to 99;
}

// 更新用户
message UpdateUserReq {
  int64  id        = 1;
  string email     = 2;
  string real_name = 3;
  string avatar    = 4;
  int32  gender    = 5;
  int32  age       = 6;
  string remark    = 7;
  // 标记需要强制清空的字段名（如 "email","remark"），不填则空值不更新
  repeated string force_clear_fields = 8;
  reserved 9 to 99;
}

message UpdateUserResp {
  uint32 code    = 1;
  string message = 2;
  reserved 3 to 99;
}

// 删除用户
message DeleteUserReq {
  int64 id = 1;
  reserved 2 to 99;
}

message DeleteUserResp {
  uint32 code    = 1;
  string message = 2;
  reserved 3 to 99;
}
