# grpc-gateway 配置
#
# REST 路由由 proto 文件中的 google.api.http 注解驱动，
# 不再需要手动配置路由端点。
#
# 支持的 REST 端点：
#   POST   /api/v1/user           → User/CreateUser
#   GET    /api/v1/user/{id}      → User/GetUser
#   POST   /api/v1/user/ping      → User/Ping
#   GET    /api/v1/product/{id}   → Product/GetProduct
#   GET    /api/v1/product/list   → Product/ListProducts
#   POST   /api/v1/product/ping   → Product/Ping

name: storemicro
version: v1

# 服务器配置
server:
  addr: :8080
  allow_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

# etcd 服务发现
etcd:
  endpoints:
    - 10.211.55.5:2379
  dial_timeout: 5s

# 日志配置
log:
  level: info
# JWT 认证（与 user 服务保持一致的 secret）
# 生产环境必须通过环境变量 JWT_SECRET 注入，此处仅为占位
jwt:
  secret: "${JWT_SECRET:store-micro-jwt-secret-2026-production}"

# Redis（用于 token 校验，支持单设备登录踢人）
redis:
  addr: "${REDIS_ADDR:10.211.55.5:6379}"
  password: "${REDIS_PASSWORD:admin@zzp}"
  db: 0

# 链路追踪
tracing:
  endpoint: "10.211.55.5:4317"
  sample_rate: 0.1
