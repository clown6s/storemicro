# grpc-gateway 配置
#
# REST 路由由 proto 文件中的 google.api.http 注解驱动，
# 修改路由请在 api/ 下的 proto 文件中更新，然后执行 make generate。
#
# 当前注册的服务: user, district
# 运行 `make generate` 重新生成 gateway 代码。

name: storemicro
version: v1

# 服务器配置
server:
  addr: :8080
  # HTTP 超时配置
  readTimeout: 30s
  writeTimeout: 60s
  idleTimeout: 120s
  allowOrigins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  trustedProxies:
    # Only set these to your real reverse proxy / load balancer IPs or CIDRs.
    # Loopback is always trusted for local development.
    - "127.0.0.1"

# etcd 服务发现
etcd:
  endpoints:
    - "${ETCD_ENDPOINT:10.211.55.5:2379}"
  dialTimeout: 5s

# 日志配置
logger:
  level: info
  mode: dev          # dev (console 彩色) | prod (JSON 格式)
  # filepath: /var/log/storemicro/gateway.log  # 日志文件路径，空 = 仅 stdout
  # maxSize: 100    # 单文件最大 MB（默认 100）
  # maxBackups: 10  # 保留旧文件数（默认 10）
  # maxAge: 30      # 保留天数（默认 30）
  # compress: true   # gzip 压缩旧文件

# JWT 配置（⚠️ 生产环境必须通过环境变量 JWT_SECRET 注入）
jwt:
  secret: '${JWT_SECRET:4*8#5@7!^i(nj_9876555=+s4x3v9g12m`js0lmb8(-=+-_!`~||\]}mb<.?,.>>,mncukdkieijufonicndknveufw3io}'

# Redis 配置（⚠️ 生产环境必须通过环境变量注入密码）
redis:
  addr: "${REDIS_HOST:10.211.55.5}:${REDIS_PORT:6379}"
  password: "${REDIS_PASSWORD:admin@zzp}"
  db: 0

# 链路追踪
tracing:
  endpoint: ""
  sampleRate: 0.1

# Prometheus metrics 认证密码（为空则不启用认证，生产环境建议设置）
metricsPassword: ""

# gRPC 出站客户端配置
grpc_client:
  # 负载均衡策略：round_robin（轮询）| pick_first（首个可用）
  loadBalancingPolicy: round_robin
  # 客户端健康检查（通过 gRPC 内置 health checking 剔除不可用实例）
  healthCheck:
    enabled: true
    interval: 10s
    timeout: 3s
  # 方法级重试策略
  retry:
    maxAttempts: 3
    initialBackoff: 0.1s
    maxBackoff: 1s
    backoffMultiplier: 2.0
    # 可重试的状态码（不建议包含 RESOURCE_EXHAUSTED，会加剧后端压力）
    retryableCodes:
      - UNAVAILABLE
  # 熔断器（gobreaker，按服务隔离）
  circuitBreaker:
    maxRequests: 5       # 半开状态最大并发
    interval: 10          # 统计周期（秒）
    timeout: 30           # 熔断时长（秒）
    failureRatio: 0.5    # 触发熔断的失败率
    minRequests: 10      # 最少请求数才触发熔断
  # 消息大小限制（MB）
  maxRecvMsgSize: 4
  maxSendMsgSize: 4
