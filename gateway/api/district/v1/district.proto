syntax = "proto3";

package api.district.v1;

option go_package = "district/api/district/v1;districtv1";

import "google/api/annotations.proto";

service District {
  rpc GetProvinceTree (GetProvinceTreeReq) returns (GetProvinceTreeResp) {
    option (google.api.http) = {
      get: "/api/v1/district/provinceTree"
    };
  }
}

message GetProvinceTreeReq {}

message GetProvinceTreeResp {
  uint32 code = 1;
  string message = 2;
  repeated DistrictTree data = 3;
}

message DistrictTree {
  int64 id = 1;
  string parentAdCode = 2;
  string adCode = 3;
  string name = 4;
  string level = 5;
  string center = 6;
  repeated GetProvinceTreeResp children = 7;
}
