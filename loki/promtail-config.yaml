server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: storemicro
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["loki.enabled=true"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
        regex: "/(.*)"
      - source_labels: ["__meta_docker_container_label_loki_job"]
        target_label: job
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - docker: {}
      # 解析 Go 结构化 JSON 日志（LOG_MODE=prod 时输出 JSON）
      - json:
          expressions:
            level: level
            msg: msg
            trace_id: trace_id
            span_id: span_id
            caller: caller
      - labels:
          level:
          caller:
      - timestamp:
          source: time
          format: RFC3339Nano
