server:
  grpc:
    addr: 0.0.0.0:9003
    timeout: 10s

data:
  database:
    driver: mysql
    source: root:admin@zzp@tcp(10.211.55.5:3306)/store_micro?charset=utf8mb4&parseTime=true&loc=Local
    max_open_conns: 100
    max_idle_conns: 25
    conn_max_lifetime: 3600

logger:
  level: info
  # mode 和文件轮转通过环境变量配置：
  #   LOG_MODE=prod       启用 JSON 格式（默认 dev = console 彩色）
  #   LOG_FILE=/var/log/storemicro/district.log  启用文件输出+轮转
  #   LOG_COMPRESS=true   启用 gzip 压缩旧日志

registry:
  etcd:
    endpoints:
      - 10.211.55.5:2379
    timeout: 10

tracing:
  endpoint: "10.211.55.5:4317"
  sample_rate: 0.1
