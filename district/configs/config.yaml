server:
  grpc:
    addr: :9003
    timeout: 10s

data:
  database:
    driver: mysql
    source: "root:${DB_PASSWORD:admin@zzp}@tcp(${DB_HOST:10.211.55.5}:${DB_PORT:3306})/store_micro?charset=utf8mb4&parseTime=true&loc=Local"
    maxOpenConns: 100
    maxIdleConns: 25
    connMaxLifetime: 3600

logger:
  level: info
  # mode 和文件轮转通过环境变量配置：
  #   LOG_MODE=prod       启用 JSON 格式（默认 dev = console 彩色）
  #   LOG_FILE=/var/log/storemicro/district.log  启用文件输出+轮转
  #   LOG_COMPRESS=true   启用 gzip 压缩旧日志

registry:
  etcd:
    endpoints:
      - "${ETCD_ENDPOINT:10.211.55.5:2379}"
    timeout: 10

tracing:
  endpoint: ""
  sampleRate: 0.1
