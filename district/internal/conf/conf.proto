syntax = "proto3";

package conf;

option go_package = "district/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server   server            = 1;
  Data     data              = 2;
  Logger   logger            = 3;
  Registry registry          = 4;
  Tracing  tracing           = 5;
  string   metrics_password  = 6;  // Prometheus metrics 认证密码，为空则禁用
}

message Tracing {
  string endpoint   = 1;
  double sampleRate = 2;
}

message Server {
  message GRPC {
    string addr = 1;
    google.protobuf.Duration timeout = 2;
  }
  GRPC grpc = 1;
}

message Data {
  message Database {
    string  driver          = 1;
    string  source          = 2;
    int64   maxOpenConns    = 3;
    int64   maxIdleConns    = 4;
    int64   connMaxLifetime = 5;
    int64   connMaxIdleTime = 6; // 空闲连接最大存活时间（秒），默认 connMaxLifetime/2
  }
  Database database = 1;
}

message Logger {
  string level = 1;
}

message Registry {
  message Etcd {
    repeated string endpoints = 1;
    int64     timeout    = 2;
    string    username   = 3;  // etcd 认证用户名（可选）
    string    password   = 4;  // etcd 认证密码（可选）
  }
  Etcd etcd = 1;
}
