# xDS 控制平面配置
# 加新服务只需在 services 下追加条目，无需改代码

# 网关监听端口
listener:
  port: 8080

# gRPC-JSON transcoder 的 proto descriptor 路径
# 注意：此路径是 Envoy 容器内的路径（由控制面写入 xDS 配置，Envoy 读取）
transcoder:
  proto_descriptor: "/root/object/storemicro/gateway/descriptor.pb"

# etcd 连接配置
etcd:
  endpoints:
    - "10.211.55.5:2379"
  prefix: "/kratos/registry/"

# ADS 控制面监听端口
ads:
  port: 18000

# 服务路由配置（核心：加服务只改这里）
services:
  - name: user                            # 服务名（对应 etcd 中的注册名）
    grpc_service: "api.user.v1.User"      # proto gRPC 服务全名（用于 transcoder）
    route_prefix: "/api/v1/user"           # HTTP 路由前缀

  - name: product                         # 服务名（对应 etcd 中的注册名）
    grpc_service: "api.product.v1.Product" # proto gRPC 服务全名
    route_prefix: "/api/v1/product"        # HTTP 路由前缀

  # 后续加新服务只需追加，例如：
  # - name: order
  #   grpc_service: "api.order.v1.Order"
  #   route_prefix: "/api/v1/order"
