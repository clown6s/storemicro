global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ---- 微服务 metrics ----
  - job_name: "storemicro-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["storemicro-gateway:7000"]

  - job_name: "storemicro-user"
    metrics_path: /metrics
    static_configs:
      - targets: ["storemicro-user:6001"]

  - job_name: "storemicro-district"
    metrics_path: /metrics
    static_configs:
      - targets: ["storemicro-district:6002"]

  # ---- 基础设施 ----
  - job_name: "redis"
    metrics_path: /metrics
    static_configs:
      - targets: ["storemicro-redis:6379"]
