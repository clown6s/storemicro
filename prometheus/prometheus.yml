global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "storemicro-gateway"
    metrics_path: /metrics
    bearer_token: admin@zzp
    static_configs:
      - targets: ["storemicro-gateway:7000"]

  - job_name: "storemicro-user"
    metrics_path: /metrics
    bearer_token: admin@zzp
    static_configs:
      - targets: ["storemicro-user:9101"]

  - job_name: "storemicro-district"
    metrics_path: /metrics
    bearer_token: admin@zzp
    static_configs:
      - targets: ["storemicro-district:9103"]
